<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库AI问答</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui;
    }
    body {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .tip {
      color: red;
      font-size: 22px;
      margin-bottom: 30px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }
    #userInput {
      flex: 1;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #000;
      border-radius: 8px;
    }
    #submitBtn {
      padding: 0 40px;
      background: #0066ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
    }
    #submitBtn:active {
      background: #004fcc;
    }
    .answer-box {
      min-height: 120px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      font-size: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>知识库AI问答</h1>
  <div class="tip">口令正确，已解锁问答</div>

  <div class="input-row">
    <input id="userInput" placeholder="输入你的问题" value="露怎么样？">
    <button id="submitBtn">提交提问</button>
  </div>

  <div class="answer-box" id="answerBox">AI知识库调用失败</div>

  <script>
    const inputEl = document.getElementById('userInput');
    const btnEl = document.getElementById('submitBtn');
    const answerBox = document.getElementById('answerBox');

    // 替换成你自己的 Workers 接口地址
    const API_URL = "https://ai.byg88.biz/chat";

    async function sendQuestion() {
      const question = inputEl.value.trim();
      if (!question) {
        answerBox.innerText = "请输入问题";
        return;
      }
      answerBox.innerText = "正在请求AI...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: [
              { role: "user", content: question }
            ]
          })
        });

        const data = await res.json();
        if (data.success) {
          answerBox.innerText = data.answer;
        } else {
          answerBox.innerText = data.msg;
          console.log("错误详情：", data.detail);
        }
      } catch (err) {
        answerBox.innerText = "网络请求失败，请检查接口地址";
        console.error(err);
      }
    }

    // 点击按钮提交
    btnEl.addEventListener('click', sendQuestion);
    // 回车提交
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendQuestion();
    });
  </script>
</body>
</html>
