<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库问答</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{max-width:1100px;margin:40px auto;padding:0 16px}
/* 口令输入区域 */
.pwd-box{
  padding:30px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:20px;
}
.pwd-box h3{
  margin-bottom:16px;
  font-size:24px;
}
#pwdInput{
  padding:12px 14px;
  width:320px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:6px;
}
#confirmPwd{
  padding:12px 24px;
  margin-left:10px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
/* 问答区域，初始隐藏 */
.chat-box{
  display:none;
}
h1{font-size:28px;margin-bottom:24px}
.input-wrap{display:flex;gap:10px;margin-bottom:20px}
#question{flex:1;padding:14px;font-size:16px;border:1px solid #ccc;border-radius:6px;outline:none}
#submit{padding:0 24px;background:#007aff;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
#result{min-height:160px;border:1px solid #eee;padding:16px;border-radius:6px;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<!-- 口令登录界面 -->
<div class="pwd-box">
  <h3>请输入访问口令</h3>
  <input type="password" id="pwdInput" placeholder="输入访问密码">
  <button id="confirmPwd">确认进入</button>
</div>

<!-- 问答交互界面 -->
<div class="chat-box">
  <h1>AI知识库问答</h1>
  <div class="input-wrap">
    <input id="question" placeholder="输入问题，回车发送">
    <button id="submit">提交</button>
  </div>
  <div id="result"></div>
</div>

<script>
const API_URL = "https://ai.byg88.biz/chat";
// 仅临时存放用户页面输入的口令，无固定明文密码
let userInputPwd = "";

// DOM元素绑定
const pwdBox = document.querySelector(".pwd-box");
const chatBox = document.querySelector(".chat-box");
const pwdInput = document.getElementById("pwdInput");
const confirmBtn = document.getElementById("confirmPwd");
const questionEl = document.getElementById("question");
const submitBtn = document.getElementById("submit");
const resultBox = document.getElementById("result");

// 口令输入确认，仅切换界面，不做本地密码比对
confirmBtn.onclick = function(){
  userInputPwd = pwdInput.value.trim();
  if(!userInputPwd){
    alert("请输入口令");
    return;
  }
  pwdBox.style.display = "none";
  chatBox.style.display = "block";
}

// 问答提交接口请求
async function sendChat() {
  const text = questionEl.value.trim();
  if (!text) {
    resultBox.innerText = "请输入问题";
    return;
  }
  resultBox.innerText = "正在查询知识库...";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Chat-Password": userInputPwd
      },
      body: JSON.stringify({
        messages: [{ role: "user", content: text }]
      })
    });
    const data = await res.json();
    if (data.success) {
      resultBox.innerText = data.answer;
    } else {
      resultBox.innerText = "错误：" + data.msg;
      // 口令错误重置页面，返回密码输入框
      if(data.msg.includes("口令错误")){
        chatBox.style.display = "none";
        pwdBox.style.display = "block";
        pwdInput.value = "";
        userInputPwd = "";
      }
    }
  } catch (e) {
    resultBox.innerText = "网络请求失败，请稍后重试";
    console.error(e);
  }
}

// 绑定点击、回车提交事件
submitBtn.addEventListener("click", sendChat);
questionEl.addEventListener("keydown", e => e.key === "Enter" && sendChat());
</script>
</body>
</html>
