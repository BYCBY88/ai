<!DOCTYPE html>
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  connect-src https://ai.byg88.biz;
">
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI知识库问答</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{
  max-width:1100px;
  margin:0 auto;
  padding:0 16px;
  background:#f8f8fa;
  background-image: radial-gradient(#ddd 1px, transparent 1px);
  background-size:16px 16px;
  min-height:100vh;
}
/* 登录口令模块 */
.pwd-box{
  padding:30px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:40px auto;
  max-width:500px;
  background:#fff;
}
.pwd-box h3{
  margin-bottom:16px;
  font-size:24px;
}
#pwdInput{
  padding:12px 14px;
  width:calc(100% - 130px);
  max-width:320px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:6px;
}
#confirmPwd{
  padding:12px 24px;
  margin-left:10px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
/* 聊天主容器 */
.chat-box{
  display:none;
  height:100vh;
  padding:20px 0;
  display:flex;
  flex-direction:column;
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-shrink:0;
}
#logout{
  padding:6px 16px;
  background:#ff4d4f;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
h1{font-size:28px;margin-bottom:0}
/* 聊天消息列表 */
.msg-list{
  flex:1;
  overflow-y:auto;
  padding-right:8px;
  margin-bottom:20px;
}
/* 消息气泡通用 */
.msg-item{
  margin-bottom:16px;
  display:flex;
  max-width:85%;
}
/* AI消息 左侧 */
.msg-ai{
  align-self:flex-start;
}
.msg-ai .msg-bubble{
  background:#fff;
  border:1px solid #eee;
  border-radius:12px 12px 12px 4px;
  padding:14px 16px;
  line-height:1.6;
  white-space:pre-wrap;
}
/* 用户消息 右侧蓝色 */
.msg-user{
  margin-left:auto;
  flex-direction:row-reverse;
}
.msg-user .msg-bubble{
  background:#007aff;
  color:#fff;
  border-radius:12px 12px 4px 12px;
  padding:14px 16px;
  line-height:1.6;
  white-space:pre-wrap;
}
/* 底部输入栏 */
.input-wrap{
  display:flex;
  gap:10px;
  flex-shrink:0;
}
#question{
  flex:1;
  padding:14px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:6px;
  outline:none;
}
#submit{
  padding:0 24px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
/* 清空对话按钮 */
.clear-convo{
  text-align:center;
  color:#999;
  font-size:14px;
  margin:8px 0;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="pwd-box">
  <h3>请输入访问口令</h3>
  <input type="password" id="pwdInput" placeholder="输入访问密码">
  <button id="confirmPwd">确认进入</button>
</div>

<div class="chat-box">
  <div class="top-bar">
    <h1>AI知识库问答</h1>
    <button id="logout">退出登录</button>
  </div>
  <!-- 聊天消息容器 -->
  <div class="msg-list" id="msgList"></div>
  <div class="clear-convo" id="clearBtn">Clear conversation</div>
  <!-- 底部输入框 -->
  <div class="input-wrap">
    <input id="question" placeholder="输入问题，回车发送">
    <button id="submit">提交</button>
  </div>
</div>

<script>
const API_URL = "https://ai.byg88.biz/chat";
let userPwd = "";
let timeoutTimer = null;

const pwdBox = document.querySelector(".pwd-box");
const chatBox = document.querySelector(".chat-box");
const pwdInput = document.getElementById("pwdInput");
const confirmBtn = document.getElementById("confirmPwd");
const logoutBtn = document.getElementById("logout");
const questionEl = document.getElementById("question");
const submitBtn = document.getElementById("submit");
const msgList = document.getElementById("msgList");
const clearBtn = document.getElementById("clearBtn");

// 清空对话记录
clearBtn.onclick = () => {
  msgList.innerHTML = "";
}

function clearLoginState(){
  userPwd = "";
  if(timeoutTimer) clearTimeout(timeoutTimer);
  chatBox.style.display = "none";
  pwdBox.style.display = "block";
  pwdInput.value = "";
  msgList.innerHTML = "";
}

function startAutoLogout(){
  if(timeoutTimer) clearTimeout(timeoutTimer);
  timeoutTimer = setTimeout(clearLoginState, 30 * 60 * 1000);
}

confirmBtn.onclick = function(){
  const rawPwd = pwdInput.value.trim();
  if(!rawPwd){
    alert("请输入口令");
    return;
  }
  userPwd = rawPwd;
  pwdBox.style.display = "none";
  chatBox.style.display = "flex";
  startAutoLogout();
}

logoutBtn.onclick = clearLoginState;

// 新增：渲染消息气泡
function renderMessage(type, content) {
  const item = document.createElement("div");
  item.className = `msg-item msg-${type}`;
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.innerText = content;
  item.appendChild(bubble);
  msgList.appendChild(item);
  // 滚动到底部
  msgList.scrollTop = msgList.scrollHeight;
}

async function sendChat() {
  const text = questionEl.value.trim();
  if (!text) {
    renderMessage("ai", "请输入问题");
    return;
  }
  // 1. 先渲染用户提问气泡
  renderMessage("user", text);
  questionEl.value = "";
  // 2. 加载中占位
  renderMessage("ai", "正在查询知识库...");
  const loadingEl = msgList.lastChild;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Chat-Pwd": userPwd,
        "X-Timestamp": String(Date.now())
      },
      body: JSON.stringify({
        messages: [{ role: "user", content: text }]
      })
    });
    const data = await res.json();
    // 移除加载占位
    loadingEl.remove();
    if (data.success) {
      renderMessage("ai", data.answer);
      startAutoLogout();
    } else {
      renderMessage("ai", "错误：" + data.msg);
      if(data.msg.includes("口令错误") || data.msg.includes("重放") || data.msg.includes("频繁")){
        clearLoginState();
      }
    }
  } catch (e) {
    loadingEl.remove();
    renderMessage("ai", "网络请求失败，请稍后重试");
  }
}

submitBtn.addEventListener("click", sendChat);
questionEl.addEventListener("keydown", e => e.key === "Enter" && sendChat());
</script>
</body>
</html>
