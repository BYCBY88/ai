<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务已停止</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 48px 36px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #d32f2f;
            margin-bottom: 16px;
        }
        .desc {
            font-size: 16px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .link-box {
            word-break: break-all;
        }
        a {
            display: inline-block;
            color: #1976d2;
            font-size: 16px;
            text-decoration: none;
            border: 1px solid #1976d2;
            padding: 12px 24px;
            border-radius: 8px;
            transition: 0.2s;
        }
        a:hover {
            background-color: #1976d2;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>该服务因意外已停止</h1>
        <p class="desc">请访问新项目页面获取最新内容</p>
        <div class="link-box">
            <a href="https://bycby88.github.io/mi/" target="_blank">https://bycby88.github.io/mi/</a>
        </div>
    </div>
</body>
</html>
